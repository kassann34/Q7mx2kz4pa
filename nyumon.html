<style>
/* Layout: 説明する人のための教壇。左に短い要点、右に大きな作図面。下に話す内容のメモを開ける。 */
:root{
  --bg:#E9ECF2; --surface:#FFFFFF; --fg:#14151B; --muted:#5B6072; --line:#D2D6E1; --accent:#2B3A8C;
  --a:#2B5AC8; --b:#DE5F19; --paper:#F7F8F4; --ink:#14151B; --ok:#1E8A55; --ng:#C23B2A;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101117;--surface:#191B23;--fg:#E7E8EF;--muted:#9A9FB3;--line:#2D303C;--accent:#8F9DF3;--ok:#4CC38A;--ng:#F07A68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101117;--surface:#191B23;--fg:#E7E8EF;--muted:#9A9FB3;--line:#2D303C;--accent:#8F9DF3;--ok:#4CC38A;--ng:#F07A68;color-scheme:dark}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:12px;padding-block:10px 8px;flex:none;flex-wrap:wrap}
header .brand{font-family:var(--f-display);font-size:16px;letter-spacing:.05em;white-space:nowrap}
.prog{display:flex;gap:4px;flex:1;min-width:160px}
.prog button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0;cursor:pointer}
.prog button[aria-current="true"]{background:var(--accent)}
.prog button.done{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.actions{display:flex;gap:6px}.actions:empty{display:none}
.navs{display:flex;gap:6px;align-items:center}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;min-height:36px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.prog button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.icon{width:40px;padding:0;display:grid;place-items:center}
.btn svg{width:18px;height:18px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;padding-bottom:12px}
.text{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto;padding-right:4px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.5vw,34px);line-height:1.25;letter-spacing:.03em;text-wrap:balance}
.lead{margin:0;font-size:clamp(15px,1.5vw,19px);line-height:1.75;max-width:30em}
.lead b{color:var(--accent)}
.formula{font-family:var(--f-mono);font-size:clamp(14px,1.4vw,18px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:30em}
.formula .ca{color:var(--a);font-weight:500}.formula .cb{color:var(--b);font-weight:500}
.key{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.key span.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.demo{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.canvasWrap{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:13px;color:#4A4F60;background:rgba(247,248,244,.88);padding:3px 8px;border-radius:6px;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
.controls .sep{width:1px;height:26px;background:var(--line)}
.controls label{display:flex;align-items:center;gap:8px;font-size:14px}
.controls input[type=range]{width:140px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.notes{flex:none;border-top:1px solid var(--line);padding-block:10px 12px;max-height:30vh;overflow:auto;font-size:15px}
.notes h2{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;color:var(--muted);font-weight:500}
.notes ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;max-width:70em}
.ex{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;max-width:32em}
.ex li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ex li b{font-family:var(--f-mono);color:var(--accent);margin-right:8px}
a.go{color:var(--accent);font-weight:700}
@media (max-width:820px),(orientation:portrait) and (max-width:1100px){
  body{overflow:auto}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .text{overflow:visible}
  .canvasWrap{flex:none;height:min(62vh,560px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>

  <div class="actions">
    <a class="btn ibtn" href="./" title="一覧に戻る" aria-label="一覧に戻る"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 9.5L10 3.5l7 6"/><path d="M5 8.5V16.5h10V8.5"/></svg></a></div>

    <div class="canvasWrap"><canvas id="cv"></canvas><div class="cap" id="cap" hidden></div></div>

  </section>
</main>
<aside class="notes" id="notes" hidden><h2>話す内容</h2><ul id="noteList"></ul></aside>
<script>
const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
function inv(m){const[a,b,c,d,e,f]=m,t=a*d-b*c;return[d/t,-b/t,-c/t,a/t,(c*f-d*e)/t,(b*e-a*f)/t];}
const ap=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
const rad=d=>d*Math.PI/180;
/* ---------- 群（敷き詰め方） ---------- */
// 分数座標の操作を "x,y" 形式の文字列で書く（国際結晶学表の標準の配置）
function opParse(str){
  const parts=str.split(',').map(s=>s.replace(/\s/g,''));
  const lin=e=>{let a=0,b=0,c=0;const toks=e.replace(/-/g,'+-').split('+').filter(Boolean);
    for(const t of toks){if(t.endsWith('x'))a+=t==='x'?1:t==='-x'?-1:parseFloat(t);
      else if(t.endsWith('y'))b+=t==='y'?1:t==='-y'?-1:parseFloat(t);
      else{const[n,d]=t.split('/');c+=d?parseFloat(n)/parseFloat(d):parseFloat(n);}}return[a,b,c];};
  const X=lin(parts[0]),Y=lin(parts[1]);
  // [a,b,c,d,e,f] : x' = a x + c y + e,  y' = b x + d y + f
  return[X[0],Y[0],X[1],Y[1],X[2],Y[2]];
}
const ops=(...l)=>l.map(opParse);
const withC=(l)=>[...l,...l.map(o=>[o[0],o[1],o[2],o[3],o[4]+.5,o[5]+.5])];
const P3=['x,y','-y,x-y','-x+y,-x'];
const GROUPS={
  // 帯状（フリーズ群）：x 方向に周期 a、y はそのままの長さ
  p111:{kind:'frieze',ops:ops('x,y'),desc:'並進だけ'},
  p1a1:{kind:'frieze',ops:ops('x,y','x+1/2,-y'),desc:'映進'},
  pm11:{kind:'frieze',ops:ops('x,y','-x,y'),desc:'│軸の鏡映'},
  p1m1:{kind:'frieze',ops:ops('x,y','x,-y'),desc:'─軸の鏡映'},
  p112:{kind:'frieze',ops:ops('x,y','-x,-y'),desc:'180°回転'},
  pma2:{kind:'frieze',ops:ops('x,y','-x,-y','-x+1/2,y','x+1/2,-y'),desc:'│軸の鏡映＋映進'},
  pmm2:{kind:'frieze',ops:ops('x,y','-x,-y','-x,y','x,-y'),desc:'│軸と─軸の鏡映'},
  // 平面（文様群）
  p1:{kind:'wall',lat:'obl',ops:ops('x,y'),desc:'並進だけ'},
  p2:{kind:'wall',lat:'obl',ops:ops('x,y','-x,-y'),desc:'180°回転'},
  pm:{kind:'wall',lat:'rect',ops:ops('x,y','-x,y'),desc:'鏡映'},
  pg:{kind:'wall',lat:'rect',ops:ops('x,y','-x,y+1/2'),desc:'映進'},
  cm:{kind:'wall',lat:'crect',ops:withC(ops('x,y','-x,y')),desc:'鏡映（中心格子）'},
  pmm:{kind:'wall',lat:'rect',ops:ops('x,y','-x,-y','-x,y','x,-y'),desc:'直交する鏡映'},
  pmg:{kind:'wall',lat:'rect',ops:ops('x,y','-x,-y','-x+1/2,y','x+1/2,-y'),desc:'鏡映＋映進'},
  pgg:{kind:'wall',lat:'rect',ops:ops('x,y','-x,-y','-x+1/2,y+1/2','x+1/2,-y+1/2'),desc:'直交する映進'},
  cmm:{kind:'wall',lat:'crect',ops:withC(ops('x,y','-x,-y','-x,y','x,-y')),desc:'直交する鏡映（中心格子）'},
  p4:{kind:'wall',lat:'sq',ops:ops('x,y','-x,-y','-y,x','y,-x'),desc:'90°回転'},
  p4m:{kind:'wall',lat:'sq',ops:ops('x,y','-x,-y','-y,x','y,-x','-x,y','x,-y','y,x','-y,-x'),desc:'90°回転＋鏡映'},
  p4g:{kind:'wall',lat:'sq',ops:ops('x,y','-x,-y','-y,x','y,-x','-x+1/2,y+1/2','x+1/2,-y+1/2','y+1/2,x+1/2','-y+1/2,-x+1/2'),desc:'90°回転＋映進'},
  p3:{kind:'wall',lat:'hex',ops:ops(...P3),desc:'120°回転'},
  p3m1:{kind:'wall',lat:'hex',ops:ops(...P3,'-y,-x','-x+y,y','x,x-y'),desc:'120°回転＋鏡映'},
  p31m:{kind:'wall',lat:'hex',ops:ops(...P3,'y,x','x-y,-y','-x,-x+y'),desc:'120°回転＋鏡映（別の向き）'},
  p6:{kind:'wall',lat:'hex',ops:ops(...P3,'-x,-y','y,-x+y','x-y,x'),desc:'60°回転'},
  p6m:{kind:'wall',lat:'hex',ops:ops(...P3,'-x,-y','y,-x+y','x-y,x','-y,-x','-x+y,y','x,x-y','y,x','x-y,-y','-x,-x+y'),desc:'60°回転＋鏡映'},
};
const LATNAME={obl:'斜方',rect:'長方',crect:'中心長方',sq:'正方',hex:'六方'};
// 格子の基底（分数座標→世界座標）
function basis(G){
  const g=GROUPS[G.name],th=G.theta*Math.PI/180,ct=Math.cos(th),st=Math.sin(th);
  let e1,e2;
  if(G.cat==='finite')return[1,0,0,1,G.ox,G.oy];
  if(g.kind==='frieze'){e1=[G.a,0];e2=[0,1];}
  else{const lat=g.lat;let a=G.a,b=G.b,ga=G.gamma;
    if(lat==='sq'){b=a;ga=90;}else if(lat==='hex'){b=a;ga=120;}else if(lat!=='obl')ga=90;
    const gr=ga*Math.PI/180;e1=[a,0];e2=[b*Math.cos(gr),b*Math.sin(gr)];}
  const R=v=>[v[0]*ct-v[1]*st,v[0]*st+v[1]*ct];e1=R(e1);e2=R(e2);
  return[e1[0],e1[1],e2[0],e2[1],G.ox,G.oy];
}
// 剰余類の代表（世界座標の変換）
function cosets(G){
  if(G.cat==='finite'){const n=G.n,out=[],th=G.theta*Math.PI/180;
    for(let k=0;k<n;k++){const t=2*Math.PI*k/n,c=Math.cos(t),s=Math.sin(t);out.push(about([c,s,-s,c,0,0],G.ox,G.oy));}
    if(G.name==='D')for(let k=0;k<n;k++){const t=2*(th+Math.PI*k/n),c=Math.cos(t),s=Math.sin(t);out.push(about([c,s,s,-c,0,0],G.ox,G.oy));}
    return out;}
  const B=basis(G),Bi=inv(B);return GROUPS[G.name].ops.map(o=>mul(B,mul(o,Bi)));
}
const about=(m,cx,cy)=>[m[0],m[1],m[2],m[3],cx-m[0]*cx-m[2]*cy+m[4],cy-m[1]*cx-m[3]*cy+m[5]];
// 世界の矩形 R を覆う群の要素を列挙（gc: グリフの中心、rg: グリフの半径）
function orbit(G,R,gc,rg,cap=2500){
  const cs=cosets(G);
  if(G.cat==='finite')return cs.map((m,i)=>({m,i}));
  const B=basis(G),Bi=inv(B),e1=[B[0],B[1]],e2=[B[2],B[3]],fr=G.cat==='frieze';
  const out=[];
  for(let i=0;i<cs.length;i++){
    const c=ap(cs[i],gc[0],gc[1]);
    let m0=1e9,m1=-1e9,n0=1e9,n1=-1e9;
    for(const[x,y]of[[R.x0-rg,R.y0-rg],[R.x1+rg,R.y0-rg],[R.x0-rg,R.y1+rg],[R.x1+rg,R.y1+rg]]){
      const dx=x-c[0],dy=y-c[1],u=Bi[0]*dx+Bi[2]*dy,v=Bi[1]*dx+Bi[3]*dy;m0=Math.min(m0,u);m1=Math.max(m1,u);n0=Math.min(n0,v);n1=Math.max(n1,v);}
    if(fr){n0=n1=0;}
    m0=Math.floor(m0);m1=Math.ceil(m1);n0=Math.floor(n0);n1=Math.ceil(n1);
    for(let m=m0;m<=m1;m++)for(let n=n0;n<=n1;n++){
      const tx=m*e1[0]+n*e2[0],ty=m*e1[1]+n*e2[1],p=[c[0]+tx,c[1]+ty];
      if(p[0]<R.x0-rg||p[0]>R.x1+rg||p[1]<R.y0-rg||p[1]>R.y1+rg)continue;
      out.push({m:mul([1,0,0,1,tx,ty],cs[i]),i});if(out.length>=cap)return out;}
  }
  return out;
}
// 点 p にいちばん近いコピー（グリフの中心 gc が p に近いもの）
function nearest(G,p,gc){
  const cs=cosets(G);let best=null;
  if(G.cat==='finite'){cs.forEach((m,i)=>{const c=ap(m,gc[0],gc[1]),d=Math.hypot(c[0]-p[0],c[1]-p[1]);if(!best||d<best.d)best={m,i,d};});return best;}
  const B=basis(G),Bi=inv(B),e1=[B[0],B[1]],e2=[B[2],B[3]],fr=G.cat==='frieze';
  cs.forEach((cm,i)=>{const c=ap(cm,gc[0],gc[1]),dx=p[0]-c[0],dy=p[1]-c[1];
    const u=Bi[0]*dx+Bi[2]*dy,v=Bi[1]*dx+Bi[3]*dy;
    for(const m of[Math.floor(u),Math.ceil(u)])for(const n of fr?[0]:[Math.floor(v),Math.ceil(v)]){
      const tx=m*e1[0]+n*e2[0],ty=m*e1[1]+n*e2[1],d=Math.hypot(c[0]+tx-p[0],c[1]+ty-p[1]);
      if(!best||d<best.d)best={m:mul([1,0,0,1,tx,ty],cm),i,d};}});
  return best;
}
// 群の点群（線形部分）
function pointGroup(G){const seen=[];for(const m of cosets(G)){const L=[m[0],m[1],m[2],m[3]].map(v=>Math.round(v*1e6)/1e6);if(!seen.some(s=>s.every((v,k)=>Math.abs(v-L[k])<1e-4)))seen.push(L);}return seen;}
/* ---------- 群の内包（同一型づくり） ---------- */
const eqMod=(a,b)=>{for(let k=0;k<4;k++)if(Math.abs(a[k]-b[k])>1e-6)return false;const dx=a[4]-b[4],dy=a[5]-b[5];return Math.abs(dx-Math.round(dx))<1e-6&&Math.abs(dy-Math.round(dy))<1e-6;};
const eqEx=(a,b)=>a.every((v,k)=>Math.abs(v-b[k])<1e-6);
const isLinI=w=>Math.abs(w[0]-1)<1e-6&&Math.abs(w[1])<1e-6&&Math.abs(w[2])<1e-6&&Math.abs(w[3]-1)<1e-6;
const REPLAT={obl:{a:1,b:.81,gamma:77},rect:{a:1,b:.73,gamma:90},crect:{a:1,b:.73,gamma:90},sq:{a:1,b:1,gamma:90},hex:{a:1,b:1,gamma:120}};
function repBasis(name){const L=REPLAT[GROUPS[name].lat];return basis({name,cat:'wall',a:L.a,b:L.b,gamma:L.gamma,theta:0,ox:0,oy:0});}
// 操作の部分集合から、文様群の名前を判定する
function classify(name,set){
  const O=GROUPS[name].ops,B=repBasis(name),Bi=inv(B),W=set.map(i=>mul(B,mul(O[i],Bi)));
  const e1=[B[0],B[1]],e2=[B[2],B[3]],pure=W.filter(isLinI).map(w=>[w[4],w[5]]);
  const latT=[];for(let m=-2;m<=2;m++)for(let n=-2;n<=2;n++)for(const p of pure)latT.push([m*e1[0]+n*e2[0]+p[0],m*e1[1]+n*e2[1]+p[1]]);
  const det=w=>w[0]*w[3]-w[1]*w[2];
  let nRot=1;for(const w of W)if(det(w)>0){const a=Math.abs(Math.atan2(w[1],w[0]));if(a>1e-6)nRot=Math.max(nRot,Math.round(2*Math.PI/a));}
  const refl=W.filter(w=>det(w)<0);

/* ---------- 内包：G=p1 で敷き詰め、Γ が最終の模様 ---------- */
function regionsWithOps(name){const set=[0],O=GROUPS[name].ops,A=AUREG[name],cls=cosetClasses(name,set),key=p=>p.map(v=>Math.round(v*1e5)).join(',');
  const cen=P=>[P.reduce((s,p)=>s+p[0],0)/P.length,P.reduce((s,p)=>s+p[1],0)/P.length];
  const shares=(P,Q)=>{const s=new Set(Q.map(key));return P.filter(p=>s.has(key(p))).length>=2;};
  const pieces=[{P:A,i:0,m:0,n:0}],done=new Set([cls[0]]),c0=cen(A),nC=Math.max(...cls)+1;
  for(let guard=0;done.size<nC&&guard<nC*2;guard++){let best=null;
    O.forEach((o,i)=>{if(done.has(cls[i]))return;for(let m=-2;m<=2;m++)for(let n=-2;n<=2;n++){
      const P=A.map(p=>{const r=ap(o,p[0],p[1]);return[r[0]+m,r[1]+n];});if(!pieces.some(Q=>shares(P,Q.P)))continue;
      const c=cen(P),d=Math.hypot(c[0]-c0[0],c[1]-c0[1]);if(!best||d<best.d-1e-9)best={P,d,c:cls[i],i,m,n};}});
    if(!best)break;pieces.push(best);done.add(best.c);}
  // 外周の辺
  const cnt=new Map(),edges=[];for(const pc of pieces)pc.P.forEach((a,k)=>{const b=pc.P[(k+1)%pc.P.length],kk=[key(a),key(b)].sort().join('|');cnt.set(kk,(cnt.get(kk)||0)+1);edges.push([a,b,kk]);});
  return{au:A,pieces,outline:edges.filter(e=>cnt.get(e[2])===1).map(e=>[e[0],e[1]])};}

    const out=[seg(INCL_G,st.g,v=>{st.g=v;st.fi=0;st.s=-1;me.view();fillF();draw();})];
    if(cfg.unit){out.push(sep(),check('単位格子（G）',true,v=>{st.cell=v;draw();}),check('Γ の単位領域',true,v=>{st.au=v;draw();}),check('G の単位領域',true,v=>{st.gr=v;draw();}),btn('Γ の変換で増やす',()=>{st.s=0;play(1600,s=>{st.s=s;},()=>{st.s=-1;});}));st.cell=st.au=st.gr=true;}
    else{const sl=(lab,k)=>{const l=document.createElement('label'),i=document.createElement('input');i.type='range';i.min=0;i.max=1;i.step=.01;i.value=st[k];i.id='cut'+k;i.oninput=()=>{st[k]=+i.value;st.s=-1;draw();};l.append(lab,i);return l;};
      out.push(sep(),sl('区切り 横',  'du'),sl('縦','dv'));}
    if(!cfg.unit)out.push(sep(),check('A の区切り',true,v=>{st.showA=v;draw();}),check('B の区切り',true,v=>{st.showB=v;draw();}),check('記号',false,v=>{st.el=v;draw();}),btn('f で写す',()=>{st.s=0;play(1600,s=>{st.s=s;},()=>{st.s=1;});}));
    out.push(fl);fillF();return out;},
  draw(){const st=this.st,{f,fw,B,reg}=this.info(),r=viewRect(),base=baseMotif(st.g),c=copies(st.g,r,base),px=PX();
    const W=p=>ap(B,p[0],p[1]),path=P=>{ctx.beginPath();P.forEach((p,k)=>{const q=W(p);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();};
    const outlineAt=(m,col,dash,w)=>{ctx.save();ctx.transform(...m);for(const[a,b]of reg.outline){const p=W(a),q=W(b);line(p[0],p[1],q[0],q[1],col,w,dash);}ctx.restore();};
    const lat=(fn)=>{for(let m=c.u0;m<=c.u1;m++)for(let n=c.v0;n<=c.v1;n++)fn(T(m*B[0]+n*B[2],m*B[1]+n*B[3]));};
    if(cfg.unit){
      if(st.cell){lat(t=>{ctx.save();ctx.transform(...t);path([[0,0],[1,0],[1,1],[0,1]]);ctx.strokeStyle=COL.grid;ctx.lineWidth=px*1.5;ctx.stroke();ctx.restore();});}
      for(const k of c.out)motif(k.m,PAL[k.i],.28);
      if(st.gr){ctx.fillStyle='rgba(43,90,200,.12)';for(const pc of reg.pieces){path(pc.P);ctx.fill();}outlineAt(T(0,0),COL.a,[px*8,px*5],px*2.6);}
      // Γ の単位領域と、その中の見本
      const show=st.s<0?reg.pieces.length:Math.min(reg.pieces.length,1+Math.floor(st.s*reg.pieces.length*1.02));
      reg.pieces.slice(0,show).forEach((pc,j)=>{const O=GROUPS[st.g].ops[pc.i],w=mul(T(pc.m*B[0]+pc.n*B[2],pc.m*B[1]+pc.n*B[3]),mul(B,mul(O,inv(B))));motif(mul(w,base),PAL[pc.i]);
        if(j===0&&st.au){path(pc.P);ctx.fillStyle='rgba(232,110,40,.22)';ctx.fill();ctx.strokeStyle=COL.b;ctx.lineWidth=px*3;ctx.stroke();}});
      cap(`G の単位領域 ＝ Γ の単位領域 × ${reg.pieces.length}（指数 ${reg.pieces.length}）`);return;}
    for(const k of c.out)motif(k.m,PAL[k.i],.9);
    const D=T(st.du*B[0]+st.dv*B[2],st.du*B[1]+st.dv*B[3]),fD=mul(fw,D);
    if(st.showA)lat(t=>outlineAt(mul(t,D),COL.a,[px*8,px*5],px*2.2));
    if(st.showB)lat(t=>outlineAt(mul(t,fD),COL.b,null,px*2.2));
    if(st.el)drawElements(st.g,r);
    // 1文字分の A を強調し、f で写す
    ctx.save();ctx.transform(...D);ctx.fillStyle='rgba(43,90,200,.16)';for(const pc of reg.pieces){path(pc.P);ctx.fill();}ctx.restore();
    if(st.s>=0){const m=mul(interp(fw,st.s),D);ctx.save();ctx.transform(...m);ctx.fillStyle=st.s>.98?'rgba(222,95,25,.28)':'rgba(43,90,200,.28)';for(const pc of reg.pieces){path(pc.P);ctx.fill();}ctx.restore();
      outlineAt(m,st.s>.98?COL.b:COL.a,null,px*3.4);}
    // f の場所
    drawFMark(fw,f,px,r);
    cap(`p1敷詰${st.g}同一型　f：${f.label}`);}};}
function drawFMark(w,f,px,r){const L=Math.hypot(r.x1-r.x0,r.y1-r.y0)*2;
  if(f.kind==='rot'){const A=[1-w[0],-w[1],-w[2],1-w[3]],dt=A[0]*A[3]-A[1]*A[2],cx=(A[3]*w[4]-A[2]*w[5])/dt,cy=(-A[1]*w[4]+A[0]*w[5])/dt;rotMark(cx,cy,f.n,px*11,COL.el);}
  else{let d=[w[0]+1,w[1]];if(Math.hypot(...d)<1e-6)d=[w[2],w[3]+1];const l=Math.hypot(...d);d=[d[0]/l,d[1]/l];const t=[w[4],w[5]],Lt=[w[0]*t[0]+w[2]*t[1],w[1]*t[0]+w[3]*t[1]],q=[(t[0]-Lt[0])/4,(t[1]-Lt[1])/4],g=[(t[0]+Lt[0])/2,(t[1]+Lt[1])/2];
    line(q[0]-d[0]*L,q[1]-d[1]*L,q[0]+d[0]*L,q[1]+d[1]*L,COL.el,px*3,f.kind==='glide'?[px*12,px*7]:null);
    if(f.kind==='glide')arrow(q[0],q[1],q[0]+g[0],q[1]+g[1],COL.el,px*2.4);}}
/* 群の内包（発展編で使う。入門では外しておく） */
const ADV=[];
/* 12 壁紙模様 */
const WALL5=[['p1','p1'],['p2','p2'],['pm','pm'],['pg','pg'],['p4','p4']];
const ALL17=Object.keys(GROUPS).filter(k=>GROUPS[k].kind==='wall');
SL.push({eyebrow:'第5回　平面の模様',title:'平面の模様は17種類',
  lead:'平面いっぱいの模様は<b>17種類</b>に分かれます。全部覚えなくて大丈夫です。まずは p1・p2・pm・pg・p4 の5つから。',
  notes:['p1：並進だけ／p2：180° 回転／pm：鏡映／pg：映進／p4：90° 回転','ひし形・正方形・六角形などの格子の形も、対称性によって決まる','「すべて」を押すと残りの12種も出せる'],
  st:{g:'p1',el:true,all:false},
  view(){const G=Gobj(this.st.g),B=basis(G),c=ap(B,.5,.5);setView(c[0],c[1],3.2);},
  controls(){const st=this.st,me=this,box=document.createElement('span');box.style.display='contents';
    const fill=()=>{box.innerHTML='';box.append(seg((st.all?ALL17.map(k=>[k,k]):WALL5),st.g,v=>{st.g=v;me.view();draw();}));};fill();
    return[box,sep(),check('ほかの12種も',false,v=>{st.all=v;if(!v&&!WALL5.some(w=>w[0]===st.g)){st.g='p1';me.view();}fill();draw();}),check('記号を表示',true,v=>{st.el=v;draw();})];},
  draw(){const st=this.st,r=viewRect(),c=copies(st.g,r,baseMotif(st.g));for(const k of c.out)motif(k.m,PAL[k.i%PAL.length],.9);if(st.el)drawElements(st.g,r);cap(`${st.g}：${GROUPS[st.g].desc}`);}});

/* 13 実作へ */
SL.push({eyebrow:'第6回　実作',title:'敷詰工房で作ってみる',
  lead:'ここからは手を動かします。段階を追って、少しずつ難しくしていきましょう。',
  html:`<ol class="ex"><li><b>課題1</b>O と X のように、区切り方だけで2つの字に読める帯を考える</li><li><b>課題2</b>b と q のように、帯を 180° 回すと別の字の帯になるものを作る</li><li><b>課題3</b>帯を裏返す（鏡映）と別の字になるものを作る</li><li><b>課題4</b>できた作品が、帯の7種類のどれになっているか調べる</li></ol><p class="lead" id="goShiki" hidden>アプリの一覧から<a class="go" href="./shiki.html">敷詰アンビグラム工房</a>を開いて描きます。</p>`,
  notes:['最初は帯で十分。平面はもう少し慣れてから','課題2・3では、1文字単体で読めなくても、帯として読めればよいことを強調する','完成したら、ほかの人に読んでもらうのがいちばんの確認','仕組み（群の内包、単位領域）は次の段階で扱う'],
  view(){setView(0,0,4.2)},
  draw(){const r=viewRect(),c=copies('p2',r,baseMotif('p2'));for(const k of c.out)motif(k.m,PAL[k.i],.35);}});

/* ---------- 進行 ---------- */
let cur=0;try{cur=Math.min(SL.length-1,Math.max(0,+(localStorage.getItem('nyumon-cur')||0)));}catch(_){}
let notesOn=false;try{notesOn=localStorage.getItem('nyumon-notes')==='1';}catch(_){}
function draw(){const s=SL[cur];resize();clear();world();s.draw&&s.draw();}
function render(){const s=SL[cur];anim=null;
  $('#text').innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>${s.formula?`<div class="formula">${s.formula}</div>`:''}${s.html||''}`;
  const gs=$('#goShiki');if(gs)gs.hidden=!/github\.io|localhost|127\.0\.0\.1/.test(location.hostname);
  $('#noteList').innerHTML=(s.notes||[]).map(n=>`<li>${n}</li>`).join('');$('#notes').hidden=!notesOn;$('#noteBtn').setAttribute('aria-pressed',notesOn);
  const c=$('#controls');c.innerHTML='';s.enter&&s.enter();if(s.controls)c.append(...s.controls.call(s));c.hidden=!s.controls;
  $('#count').textContent=`${cur+1} / ${SL.length}`;
  [...$('#prog').children].forEach((b,i)=>{b.setAttribute('aria-current',i===cur);b.classList.toggle('done',i<cur);});
  cap('');resize();s.view&&s.view.call(s);draw();
  try{localStorage.setItem('nyumon-cur',cur);}catch(_){}}
function go(i){cur=Math.max(0,Math.min(SL.length-1,i));render();}
$('#prog').innerHTML=SL.map((s,i)=>`<button type="button" title="${i+1}. ${s.title}" aria-label="${i+1}. ${s.title}"></button>`).join('');
[...$('#prog').children].forEach((b,i)=>b.onclick=()=>go(i));
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#noteBtn').onclick=()=>{notesOn=!notesOn;try{localStorage.setItem('nyumon-notes',notesOn?'1':'0');}catch(_){}$('#notes').hidden=!notesOn;$('#noteBtn').setAttribute('aria-pressed',notesOn);resize();SL[cur].view&&SL[cur].view.call(SL[cur]);draw();};
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}else if(e.key==='n'||e.key==='N')$('#noteBtn').click();});
new ResizeObserver(()=>{resize();SL[cur].view&&SL[cur].view.call(SL[cur]);draw();}).observe($('.canvasWrap'));
render();
if(document.fonts&&document.fonts.load)document.fonts.load('40px "Dela Gothic One"').then(()=>draw()).catch(()=>{});
</script>
